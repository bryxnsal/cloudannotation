[project]
name = "cloudannotation"
version = "0.3.1"
description = "Herramienta de anotación y visualización 3D de nubes de puntos"
readme = "README.md"
requires-python = ">=3.8,<3.9"
dependencies = [
    "numpy>=1.19.5,<2.0.0",
    "pandas>=1.1.5",
    "plyfile>=0.8",
    "laspy>=2.0.0",
    "scipy>=1.5.4",
    "scikit-learn>=0.24.2",
    "tqdm>=4.60.0",
    "matplotlib>=3.3.0",
    "pyquaternion>=0.9.9",
    "Pillow>=8.4.0",
    "pynput>=1.7.6",
    "pywin32>=306 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
pptk = [
    "pptkx @ https://github.com/bryxnsal/pptkx/releases/download/v0.1.2/pptkx-0.1.2-cp38-cp38-linux_x86_64.whl ; sys_platform == 'linux'",
    "pptkx @ https://github.com/bryxnsal/pptkx/releases/download/v0.1.2/pptkx-0.1.2-cp38-cp38-win_amd64.whl ; sys_platform == 'win32'",
]
open3d = [
    "open3d==0.19.0",
]
vispy = [
    "vispy>=0.14.0",
    "glfw>=2.5.0",
    "PyQt5>=5.15.0",
]
pyvista = [
    "pyvista>=0.43.0",
    "vtk>=9.2.0",
]
all = [
    "open3d==0.19.0",
    "vispy>=0.14.0",
    "glfw>=2.5.0",
    "PyQt5>=5.15.0",
    "pyvista>=0.43.0",
    "vtk>=9.2.0",
    "pptkx @ https://github.com/bryxnsal/pptkx/releases/download/v0.1.2/pptkx-0.1.2-cp38-cp38-linux_x86_64.whl ; sys_platform == 'linux'",
    "pptkx @ https://github.com/bryxnsal/pptkx/releases/download/v0.1.2/pptkx-0.1.2-cp38-cp38-win_amd64.whl ; sys_platform == 'win32'",
]

[project.scripts]
cdann = "Main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["Main", "PointCloud", "Config", "GUI", "Mask", "Voxelize", "knn"]

[tool.setuptools.packages.find]
include = ["core*", "gui*", "alg*"]
